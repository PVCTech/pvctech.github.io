            let tbl1 = document.getElementById('dsMenu1Table');
            var DSButton1 = [
                new MenuButton("/giaPha",'/giaPha','',''),
                new MenuButton("/musicPlayer-html",'/musicPlayer-html','','15px'),
                new MenuButton("/dashBoard",'/dashBoard','','15px'),
                new MenuButton("/webWidgets",'/webWidgets','','18px'),
                new MenuButton("/image-timestamp",'/image-timestamp','','15px'),
                new MenuButton("/svg-maker",'/svg-maker','','15px'),
                new MenuButton("/photoshop",'/photoshop','','15px'),
                new MenuButton("/clock",'/clock','','15px'),

                new MenuButton("/quay-so-trung-thuong",'/quay-so-trung-thuong','','15px'),
                new MenuButton("/clock-html",'/clock-html','','15px'),
                new MenuButton("/9a8",'/9a8','','15px'),

            ];
      
            for (let i=1; i < DSButton1.length; i= i +2)
            {
                let tr = document.createElement('tr');
                let td1 = document.createElement('td');
                td1.style.width = '50%';
                let td2 = document.createElement('td');

                td1.appendChild(DSButton1[i].toElement());
                if (i + 1 < DSButton1.length)
                {
                    td2.appendChild(DSButton1[i + 1].toElement());
                }
                tr.appendChild(td1);
                tr.appendChild(td2);
                tbl1.appendChild(tr);
            }
        </script>
