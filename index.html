<div id="leftPannel" class="leftPannel pannel">

        <table id="dsMenu1Table" style="width:90%;margin-top:10px;"></table>
        <script>
            let tbl1 = document.getElementById('dsMenu1Table');
            var DSButton1 = [
                new MenuButton("https://canva.com",'Edit media','canva.png','15px'),
                new MenuButton("https://chat.zalo.me",'Zalo','zalo.png','15px'),
                new MenuButton("https://mail.google.com/",'Gmail','gmail.png','15px'),
                new MenuButton("https://mailinhnamdinh.github.io/",'Mai Linh App','mailinh.png','18px'),
                new MenuButton("https://pkpgroup.github.io/music-player-html/",'CD PKPPhương','cd.png','15px'),
                new MenuButton("https://pkp-deptrai.github.io/PKPweb/thoi-khoa-bieu.htm",'Thời khoá biểu','','15px')
            ];
      
            for (let i=1; i < DSButton1.length; i= i +2)
            {
                let tr = document.createElement('tr');
                let td1 = document.createElement('td');
                td1.style.width = '50%';
                let td2 = document.createElement('td');

                td1.appendChild(DSButton1[i].toElement());
                if (i + 1 < DSButton1.length)
                {
                    td2.appendChild(DSButton1[i + 1].toElement());
                }
                tr.appendChild(td1);
                tr.appendChild(td2);
                tbl1.appendChild(tr);
            }
        </script>

new MenuButton("https://phamcuong8868.github.io/chinese/",'Chinese everyday','','')];
